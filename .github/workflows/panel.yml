name: Yönlendirme

# Panel 2026-10-28'de meta-ads-sheets-sync reposuna taşındı; bu adres yalnız
# oraya yönlendirir. Zamanlama yok — tek seferlik yayın.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yonlendirme
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
